name: bump-manifest

on:
  push:
    branches: [release]

jobs:
  bump-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout argocd-learn-demo
        uses: actions/checkout@v4
        with:
          repository: foreverLoveWisdom/argocd-learn-demo
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Checkout gitops-app-demo (for SHA)
        uses: actions/checkout@v4
        with:
          path: gitops-app-demo

      - name: Bump image tag
        id: bump
        run: |
          # real coffret shape (pipeline-map.md row 6-7): tag = release-<sha> of the
          # commit that triggered this, not a hardcoded/toggled value. Tradeoff: this
          # tag won't exist on Docker Hub, so nginx-demo will fail ImagePullBackOff —
          # accepted deliberately, matches session 3's break/fix territory.
          SHA=$(git -C gitops-app-demo rev-parse --short HEAD)
          NEW_TAG="release-${SHA}"
          sed -i "s|image: docker.io/foreverlovewisdom/gitops-app-demo:.*|image: docker.io/foreverlovewisdom/gitops-app-demo:${NEW_TAG}|" deployment.yaml
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          git config user.email "bump-bot@example.com"
          git config user.name "bump-bot"
          git checkout -b "bump-nginx-${NEW_TAG}-${GITHUB_RUN_NUMBER}"
          git add deployment.yaml
          git commit -m "chore: bump nginx image to ${NEW_TAG}"

      - name: Push and open+merge PR
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          git push origin HEAD
          gh pr create -R foreverLoveWisdom/argocd-learn-demo \
            --base master \
            --title "bump nginx image to ${{ steps.bump.outputs.new_tag }}" \
            --body "Auto-bumped by bump-manifest workflow (stand-in for real coffret's stage-6 bot, mechanism unknown per pipeline-map.md open question B)."
          gh pr merge -R foreverLoveWisdom/argocd-learn-demo --squash \
            "bump-nginx-${{ steps.bump.outputs.new_tag }}-${{ github.run_number }}"
