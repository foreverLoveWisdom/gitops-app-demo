name: auto-r2m

on:
  push:
    branches: [release]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-to-master-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open or update release->master PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base master --head release \
            --title "Deploy release to master" \
            --body "Auto-opened by auto-r2m workflow (stand-in for git-pr-release)." \
          || echo "PR already exists, nothing to do"
