name: auto-r2m

on:
  push:
    branches: [release]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-to-master-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Open or update release->master PR via git-pr-release
        env:
          GIT_PR_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_STAGING: release
          GIT_PR_RELEASE_BRANCH_PRODUCTION: master
        run: bundle exec git-pr-release --squashed
